# Kernel 进程编排、Cognition Service 与入站治理。

cognition_service:
  request_timeout_ms: 30000
  registration_timeout_ms: 120000

lifecycle:
  start_timeout_ms: 30000
  stop_timeout_ms: 30000
  module_start_order:
    - config
    - persistence
    - kernel-transport
    - cognition
    - extensions
    - life_clock
  module_stop_order:
    - life_clock
    - extensions
    - cognition
    - kernel-transport
    - persistence
    - config

ingress:
  rate_limit_per_source: 30
  rate_limit_window_ms: 60000
  max_concurrent_requests: 10
  circuit_breaker_threshold: 5
  circuit_breaker_recovery_ms: 30000
