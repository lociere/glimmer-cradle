    <text x="882" y="38" fill="#08463A" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">GLINT</text>
    <g fill="#FFFFFF" font-family="Consolas, monospace" font-size="17"><text x="18" y="178">#004344</text><text x="234" y="178">#006D68</text><text x="450" y="178">#00B6A5</text><text x="666" y="178">#00C8AE</text></g>
    <text x="882" y="178" fill="#08463A" font-family="Consolas, monospace" font-size="17">#85E8C6</text>
