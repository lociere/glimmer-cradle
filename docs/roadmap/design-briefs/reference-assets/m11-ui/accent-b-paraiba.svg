  <text x="56" y="108" fill="#666B6B" font-family="Segoe UI, sans-serif" font-size="18">Reference asset only · balanced blue-green electric light</text>
  <g transform="translate(56 142)">
    <rect width="208" height="210" rx="18" fill="#004344"/><rect x="216" width="208" height="210" rx="18" fill="#006D68"/>
    <rect x="432" width="208" height="210" rx="18" fill="#00B6A5"/><rect x="648" width="208" height="210" rx="18" fill="#00C8AE"/>
