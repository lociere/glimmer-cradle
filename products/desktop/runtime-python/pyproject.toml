[project]
name = "glimmer-cradle-desktop-python-runtime"
version = "0.2.6"
description = "Locked Python dependency set for the installed Desktop runtime."
requires-python = ">=3.12,<3.13"
dependencies = [
    "glimmer-cradle-contracts==0.2.6",
    "glimmer-cradle-cognition==0.2.6",
    "glimmer-cradle-cognition-worker==0.1.0",
    "glimmer-cradle-audio-engine[asr,tts]==0.2.6",
]

[tool.uv.sources]
glimmer-cradle-contracts = { workspace = true }
glimmer-cradle-cognition = { workspace = true }
glimmer-cradle-cognition-worker = { workspace = true }
glimmer-cradle-audio-engine = { workspace = true }

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
