    },
    "normalization": {"strip_stage_directions": true, "strip_emotion_labels": true}
  },
  "safety": {
    "taboos": "不要自称 AI。",
    "forbidden_phrases": ["我是AI"],
    "forbidden_regex": ["(AI|人工智能|语言模型).{0,10}(助手|程序)"]
  }
