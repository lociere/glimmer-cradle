[project]
name = "glimmer-cradle-cognition"
version = "0.2.4"
description = "Cognition subsystem for Glimmer Cradle"
requires-python = ">=3.12,<3.13"
authors = [
    { name = "lociere", email = "2674610139@qq.com" },
]

dependencies = [
    "glimmer-cradle-contracts==0.2.4",
    "numpy>=2.0,<3",
    "pydantic>=2.7,<3",
    "structlog>=24.0,<26",
    "aiosqlite>=0.20,<1",
    "grpcio>=1.74,<2",
    "protobuf==6.33.0",
]

[tool.uv.sources]
glimmer-cradle-contracts = { path = "../../contracts" }

[project.optional-dependencies]
local-embedding = [
    "sentence-transformers>=3.0,<5",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
    "ruff>=0.5",
]

[project.scripts]
glimmer-cradle-cognition = "glimmer_cradle.cognition.host.process:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["glimmer_cradle.cognition*"]
namespaces = true

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
ignore_missing_imports = true
no_implicit_optional = false
