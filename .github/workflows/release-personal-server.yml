name: 发布 Personal Server

concurrency:
  group: release-personal-server-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-fixed-artifact:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release_metadata.outputs.version }}
      manifest_digest: ${{ steps.release_metadata.outputs.manifest_digest }}
      image_digest: ${{ steps.build_image.outputs.digest }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: 检出源码
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: 配置 pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: 配置 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 配置 uv 与 Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: '0.11.28'
          python-version: '3.12.13'

      - name: 执行发布门禁
        run: |
          test "$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME#v}"
          pnpm install --frozen-lockfile
          pnpm sync:contracts
          git diff --exit-code
          pnpm check:encoding
          pnpm test
          pnpm typecheck
          pnpm build

      - name: 配置 Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: 验证固定基础镜像
        env:
          NODE_IMAGE: ${{ vars.PERSONAL_SERVER_NODE_IMAGE }}
          PYTHON_IMAGE: ${{ vars.PERSONAL_SERVER_PYTHON_IMAGE }}
          UV_IMAGE: ${{ vars.PERSONAL_SERVER_UV_IMAGE }}
        run: |
          for value in "$NODE_IMAGE" "$PYTHON_IMAGE" "$UV_IMAGE"; do
            echo "$value" | grep -Eq '^.+@sha256:[0-9a-f]{64}$'
          done

      - name: 登录 GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并发布 OCI 镜像
        id: build_image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/personal-server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/glimmer-cradle-personal-server:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/glimmer-cradle-personal-server:latest
          provenance: mode=max
          sbom: true
          build-args: |
            NODE_IMAGE=${{ vars.PERSONAL_SERVER_NODE_IMAGE }}
            PYTHON_IMAGE=${{ vars.PERSONAL_SERVER_PYTHON_IMAGE }}
            UV_IMAGE=${{ vars.PERSONAL_SERVER_UV_IMAGE }}

      - name: 为 OCI digest 生成 GitHub Sigstore provenance
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/glimmer-cradle-personal-server
          subject-digest: ${{ steps.build_image.outputs.digest }}
          push-to-registry: true

      - name: 生成部署发布包
        id: release_metadata
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          VERSION="${GITHUB_REF_NAME#v}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER}/glimmer-cradle-personal-server:${GITHUB_REF_NAME}@${{ steps.build_image.outputs.digest }}"
          docker pull "$IMAGE"
          DIGEST="${{ steps.build_image.outputs.digest }}"
          DIGEST_HEX="${DIGEST#sha256:}"
          ARCHIVE_IMAGE="glimmer-cradle/personal-server:release-v${VERSION}-${DIGEST_HEX:0:12}"
          docker tag "$IMAGE" "$ARCHIVE_IMAGE"
          IMAGE_ID="$(docker image inspect --format '{{.Id}}' "$ARCHIVE_IMAGE")"
          docker save --output personal-server-linux-amd64.tar "$ARCHIVE_IMAGE"
          export GLIMMER_CRADLE_SOURCE_COMMIT="$GITHUB_SHA"
          node products/personal-server/scripts/package-release.mjs "$VERSION" "$IMAGE" personal-server-linux-amd64.tar "$ARCHIVE_IMAGE" "$IMAGE_ID"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          MANIFEST="dist/personal-server/${VERSION}/linux-amd64/artifact-manifest.json"
          echo "manifest_digest=$(sha256sum "$MANIFEST" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: 验证 OCI 入口组件
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER}/glimmer-cradle-personal-server:${GITHUB_REF_NAME}@${{ steps.build_image.outputs.digest }}"
          test "$(docker run --rm --entrypoint /usr/local/bin/caddy "$IMAGE" version | awk '{print $1}')" = 'v2.10.2'

      - name: 验证部署发布包
        run: |
          ARTIFACT_ROOT="dist/personal-server/${{ steps.release_metadata.outputs.version }}/linux-amd64"
          node products/personal-server/scripts/verify-release.mjs "$ARTIFACT_ROOT" \
            --expected-commit "$GITHUB_SHA" \
            --expected-manifest-digest "${{ steps.release_metadata.outputs.manifest_digest }}" \
            --expected-builder products/personal-server/scripts/package-release.mjs \
            --expected-issuer github-actions-sigstore \
            --expected-oci-digest "${{ steps.build_image.outputs.digest }}"
          cd "$ARTIFACT_ROOT"
          sha256sum --check SHA256SUMS
          test -f "glimmer-cradle-personal-server-v${{ steps.release_metadata.outputs.version }}-linux-amd64.tar.gz"
          test -f "glimmer-cradle-personal-server-v${{ steps.release_metadata.outputs.version }}-linux-amd64-full.tar.gz"
          test -x glimmer-cradle-installer.sh
          test -x glimmer-cradle-remote-installer.sh
          test -s release-notes.md
          PACKAGE="glimmer-cradle-personal-server-v${{ steps.release_metadata.outputs.version }}-linux-amd64.tar.gz"
          tar -tzf "$PACKAGE" \
            | grep -qx 'glimmer-cradle-personal-server/VERSION'
          mkdir extracted
          tar -xzf "$PACKAGE" -C extracted
          ENV_FILE=extracted/glimmer-cradle-personal-server/.env.example
          APP_IMAGE="$(grep '^GLIMMER_CRADLE_IMAGE=' "$ENV_FILE" | cut -d= -f2-)"
          CADDY_IMAGE="$(grep '^GLIMMER_CRADLE_CADDY_IMAGE=' "$ENV_FILE" | cut -d= -f2-)"
          test "$APP_IMAGE" = "$CADDY_IMAGE"
          docker compose \
            --project-directory extracted/glimmer-cradle-personal-server \
            --env-file "$ENV_FILE" \
            --file extracted/glimmer-cradle-personal-server/compose.yaml \
            config --quiet
          FULL_PACKAGE="glimmer-cradle-personal-server-v${{ steps.release_metadata.outputs.version }}-linux-amd64-full.tar.gz"
          tar -tzf "$FULL_PACKAGE" | grep -qx 'glimmer-cradle-personal-server/images/personal-server-linux-amd64.tar'
          tar -xOf "$FULL_PACKAGE" glimmer-cradle-personal-server/images/IMAGE | grep -qxF "$APP_IMAGE"
          ARCHIVE_IMAGE="$(tar -xOf "$FULL_PACKAGE" glimmer-cradle-personal-server/images/ARCHIVE_IMAGE)"
          ARCHIVE_IMAGE_ID="$(tar -xOf "$FULL_PACKAGE" glimmer-cradle-personal-server/images/IMAGE_ID)"
          ! tar -tzf "$FULL_PACKAGE" | grep -Eqi '(^|/)(secrets\.yaml|data|logs?|cache|backups?|models?)(/|$)|\.(live2d|moc3)$'
          tar -xOf "$PACKAGE" glimmer-cradle-personal-server/RELEASE-MANIFEST.sha256 > light-manifest.sha256
          tar -xOf "$FULL_PACKAGE" glimmer-cradle-personal-server/RELEASE-MANIFEST.sha256 > full-manifest.sha256
          cmp light-manifest.sha256 full-manifest.sha256
          tar -xOf "$FULL_PACKAGE" glimmer-cradle-personal-server/images/personal-server-linux-amd64.tar > image-archive.tar
          docker image rm "$ARCHIVE_IMAGE" >/dev/null
          docker load --input image-archive.tar >/dev/null
          test "$(docker image inspect --format '{{.Id}}' "$ARCHIVE_IMAGE")" = "$ARCHIVE_IMAGE_ID"
          rm -rf extracted light-manifest.sha256 full-manifest.sha256 image-archive.tar

      - name: 为固定发布物生成 GitHub Sigstore provenance
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: dist/personal-server/${{ steps.release_metadata.outputs.version }}/linux-amd64/*

      - name: 上传固定制品
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: personal-server-${{ steps.release_metadata.outputs.version }}-linux-amd64
          path: dist/personal-server/${{ steps.release_metadata.outputs.version }}/linux-amd64/
          if-no-files-found: error

  release:
    needs: build-fixed-artifact
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      attestations: read
      packages: read
    steps:
      - name: 检出 verifier
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: 下载固定制品
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: personal-server-${{ needs.build-fixed-artifact.outputs.version }}-linux-amd64
          path: dist/personal-server/${{ needs.build-fixed-artifact.outputs.version }}/linux-amd64/

      - name: 重新验证固定制品与外部可信 provenance
        env:
          ARTIFACT_ROOT: dist/personal-server/${{ needs.build-fixed-artifact.outputs.version }}/linux-amd64
          GH_TOKEN: ${{ github.token }}
        run: |
          node products/personal-server/scripts/verify-release.mjs "$ARTIFACT_ROOT" \
            --expected-commit "$GITHUB_SHA" \
            --expected-manifest-digest "${{ needs.build-fixed-artifact.outputs.manifest_digest }}" \
            --expected-builder products/personal-server/scripts/package-release.mjs \
            --expected-issuer github-actions-sigstore \
            --expected-oci-digest "${{ needs.build-fixed-artifact.outputs.image_digest }}"
          for artifact in "$ARTIFACT_ROOT"/*; do
            gh attestation verify "$artifact" \
              --repo "$GITHUB_REPOSITORY" \
              --source-digest "$GITHUB_SHA" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-personal-server.yml"
          done
          gh attestation verify \
            "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/glimmer-cradle-personal-server@${{ needs.build-fixed-artifact.outputs.image_digest }}" \
            --bundle-from-oci \
            --repo "$GITHUB_REPOSITORY" \
            --source-digest "$GITHUB_SHA" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-personal-server.yml"

      - name: 仅发布已固定制品
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: Glimmer Cradle ${{ needs.build-fixed-artifact.outputs.version }}
          body_path: dist/personal-server/${{ needs.build-fixed-artifact.outputs.version }}/linux-amd64/release-notes.md
          fail_on_unmatched_files: true
          files: |
            dist/personal-server/${{ needs.build-fixed-artifact.outputs.version }}/linux-amd64/glimmer-cradle-personal-server-v*-linux-amd64.tar.gz
            dist/personal-server/${{ needs.build-fixed-artifact.outputs.version }}/linux-amd64/glimmer-cradle-personal-server-v*-linux-amd64-full.tar.gz
            dist/personal-server/${{ needs.build-fixed-artifact.outputs.version }}/linux-amd64/glimmer-cradle-installer.sh
            dist/personal-server/${{ needs.build-fixed-artifact.outputs.version }}/linux-amd64/glimmer-cradle-remote-installer.sh
            dist/personal-server/${{ needs.build-fixed-artifact.outputs.version }}/linux-amd64/SHA256SUMS
            dist/personal-server/${{ needs.build-fixed-artifact.outputs.version }}/linux-amd64/artifact-manifest.json
            dist/personal-server/${{ needs.build-fixed-artifact.outputs.version }}/linux-amd64/provenance.json
            dist/personal-server/${{ needs.build-fixed-artifact.outputs.version }}/linux-amd64/sbom.spdx.json
            dist/personal-server/${{ needs.build-fixed-artifact.outputs.version }}/linux-amd64/build-claim.json
