syntax = "proto3";

package glimmer.capabilities.v1;

import "google/protobuf/struct.proto";
import "glimmer/common/v1/service_contract.proto";

option csharp_namespace = "GlimmerCradle.Contracts.Glimmer.Capabilities.V1";

// 方法知识的引用/发现/正文与可执行 Tool 独立；模型选择引用不授予任何权限。
message SkillReference {
  string skill_id = 1;
  string definition_revision = 2;
}

message SkillDescriptor {
  SkillReference reference = 1;
  string name = 2;
  string description = 3;
  // 动态方法的参数 Schema；静态方法使用 object，无正文或执行权限。
  google.protobuf.Value input_schema = 4;
}

message SkillMaterial {
  SkillReference reference = 1;
  // 不可信任务参考材料；不是 system instruction 或已验证事实。
  string instructions = 2;
}

message CapabilityReference {
  string id = 1;
  string revision = 2;
}

message CapabilityScopeContext {
  string source_provider_id = 1;
  string scene_id = 2;
  string conversation_id = 3;
  optional string user_id = 4;
}

message ToolDescriptor {
  CapabilityReference reference = 1;
  string name = 2;
  string description = 3;
  google.protobuf.Value input_schema = 4;
}

message ResourceDescriptor {
  CapabilityReference reference = 1;
  string name = 2;
  string description = 3;
  google.protobuf.Value input_schema = 4;
}

message ExposeStepRequest {
  glimmer.common.v1.CallMetadata call = 1;
  string run_id = 2;
  uint32 step = 3;
  CapabilityScopeContext scope = 4;
  repeated string protocol_features = 5;
  uint32 max_definitions = 6;
  uint32 max_definition_bytes = 7;
  uint32 remaining_tool_calls = 8;
}

message ExposeStepResponse {
  string run_id = 1;
  uint32 step = 2;
  repeated ToolDescriptor tools = 3;
  repeated SkillDescriptor skills = 4;
  repeated ResourceDescriptor resources = 5;
  uint32 used_definition_bytes = 6;
  bool truncated = 7;
}

message InvokeToolRequest {
  glimmer.common.v1.CallMetadata call = 1;
  string run_id = 2;
  uint32 step = 3;
  string call_id = 4;
  string name = 5;
  CapabilityReference reference = 6;
  CapabilityScopeContext scope = 7;
  google.protobuf.Struct arguments = 8;
  // Worker 先持久提交原生 ToolCall ACTION；不得以模型自报引用代替。
  string source_fact_id = 9;
}

message InvokeToolResponse {
  string call_id = 1;
  string name = 2;
  ExecutionResultState state = 3;
  google.protobuf.Value result = 4;
  string error = 5;
  string result_event_id = 6;
}

// 加载操作不把方法/资源注册成 Tool；仍需当次曝光与独立定义版本。
message ReadCapabilityRequest {
  glimmer.common.v1.CallMetadata call = 1;
  string run_id = 2;
  uint32 step = 3;
  string call_id = 4;
  string name = 5;
  CapabilityReference reference = 6;
  CapabilityScopeContext scope = 7;
  google.protobuf.Struct arguments = 8;
  string source_fact_id = 9;
}

message ResourceContent {
  CapabilityReference reference = 1;
  // SHA-256(实际 content_utf8 UTF-8 bytes)；不是定义 revision。
  string content_revision = 2;
  string media_type = 3;
  string content_utf8 = 4;
}

message ReadCapabilityResponse {
  string call_id = 1;
  string name = 2;
  ExecutionResultState state = 3;
  oneof content {
    SkillMaterial skill = 4;
    ResourceContent resource = 5;
  }
  string error = 6;
  string result_event_id = 7;
}

service CapabilityService {
  rpc ExposeStep(ExposeStepRequest) returns (ExposeStepResponse);
  rpc InvokeTool(InvokeToolRequest) returns (InvokeToolResponse);
  rpc ReadSkill(ReadSkillRequest) returns (ReadSkillResponse);
  rpc ReadResource(ReadResourceRequest) returns (ReadResourceResponse);
}

// 独立 RPC 外壳复用同一调用/正文定义。
message ReadSkillRequest { ReadCapabilityRequest request = 1; }
message ReadSkillResponse { ReadCapabilityResponse result = 1; }
message ReadResourceRequest { ReadCapabilityRequest request = 1; }
message ReadResourceResponse { ReadCapabilityResponse result = 1; }

enum ExecutionResultState {
  EXECUTION_RESULT_STATE_UNSPECIFIED = 0;
  EXECUTION_RESULT_STATE_SUCCEEDED = 1;
  EXECUTION_RESULT_STATE_FAILED = 2;
  EXECUTION_RESULT_STATE_UNKNOWN = 3;
}

enum ExecutionSideEffects {
  EXECUTION_SIDE_EFFECTS_UNSPECIFIED = 0;
  EXECUTION_SIDE_EFFECTS_NONE = 1;
  EXECUTION_SIDE_EFFECTS_CONFIRMED = 2;
  EXECUTION_SIDE_EFFECTS_UNKNOWN = 3;
}

// Execution 拥有结果；不传入请求正文/授权详情，也不复制 Conversation 拓扑。
message ExecutionResultEvent {
  // SHA-256(紧凑 UTF-8 JSON [invocation_id, revision])。
  string event_id = 1;
  string invocation_id = 2;
  uint64 revision = 3;
  uint32 attempt = 4;
  string scope_id = 5;
  string conversation_id = 6;
  string source_fact_id = 7;
  string executor_id = 8;
  string capability_id = 9;
  string definition_revision = 10;
  string request_digest = 11;
  ExecutionResultState state = 12;
  ExecutionSideEffects side_effects = 13;
  // succeeded 必须有 presence；null 是已确认结果，不是“缺少结果”。
  google.protobuf.Value result = 14;
  string error_code = 15;
  uint64 updated_at_ms = 16;
}
