syntax = "proto3";

package glimmer.jobs.v1;

option csharp_namespace = "GlimmerCradle.Contracts.Glimmer.Jobs.V1";

import "google/protobuf/struct.proto";
import "glimmer/common/v1/service_contract.proto";

enum JobStatus {
  JOB_STATUS_UNSPECIFIED = 0;
  JOB_STATUS_QUEUED = 1;
  JOB_STATUS_RUNNING = 2;
  JOB_STATUS_RETRY_WAIT = 3;
  JOB_STATUS_SUCCEEDED = 4;
  JOB_STATUS_CANCELLED = 5;
  JOB_STATUS_DEAD_LETTER = 6;
  JOB_STATUS_UNKNOWN = 7;
}

// Jobs outbox 的不可变事实。取消只表示调度意图撤销，不证明领域副作用回滚。
message JobStateEvent {
  // SHA-256(紧凑 UTF-8 JSON [job_id, revision])；同一事实重投不能换 ID。
  string event_id = 1;
  string job_id = 2;
  string scope_id = 3;
  string goal_id = 4;
  string kind = 5;
  uint64 revision = 6;
  JobStatus status = 7;
  uint64 attempt = 8;
  uint64 authority_epoch = 9;
  uint64 fencing_token = 10;
  google.protobuf.Struct result = 11;
  optional string error_code = 12;
  uint64 updated_at_ms = 13;
}

// 原执行身份在失效/切代后仍用于接收端对账；不以当前 Job identity 替代。
// 整数字段在跨语言消费端限制为正数且不超过 JavaScript safe integer。
message JobExecutionIdentity {
  string job_id = 1;
  string scope_id = 2;
  uint64 attempt = 3;
  uint64 authority_epoch = 4;
  uint64 fencing_token = 5;
  string owner_id = 6;
  uint64 lease_until_ms = 7;
}

// Host 控制面仅公开状态元数据；正文、结果、租约/证据身份留在各领域 owner。
message JobProjection {
  string job_id = 1;
  string scope_id = 2;
  string goal_id = 3;
  string kind = 4;
  JobStatus status = 5;
  uint64 revision = 6;
  uint64 attempt = 7;
  uint64 due_at_ms = 8;
  optional string error_code = 9;
  uint64 updated_at_ms = 10;
  bool state_feedback_pending = 11;
}

// available 表示此 handler 的实际装配可用；每个源 Job 仍须独立业务接纳。
message JobHandlerProjection {
  string kind = 1;
  string retry_mode = 2;
  bool available = 3;
}

message ReadJobsProjectionRequest {
  glimmer.common.v1.CallMetadata call = 1;
  string scope_id = 2;
  uint32 limit = 3;
  optional string after_job_id = 4;
}

enum JobNotificationState {
  JOB_NOTIFICATION_STATE_UNSPECIFIED = 0;
  JOB_NOTIFICATION_STATE_PENDING = 1;
  JOB_NOTIFICATION_STATE_ACKNOWLEDGED = 2;
  JOB_NOTIFICATION_STATE_REVOKED = 3;
}

// 由通知 owner 的原请求与真实确认重建；不从 Job success 或 transport sent 推断送达。
message JobNotificationProjection {
  string job_id = 1;
  string notification_id = 2;
  JobNotificationState state = 3;
  // 已确认的历史可能后来撤销；两项事实同时保留。
  bool revoked = 4;
  uint64 created_at_ms = 5;
  optional uint64 acknowledged_at_ms = 6;
  optional string delivery_kind = 7;
}

message ReadJobsProjectionResponse {
  uint64 authority_epoch = 1;
  repeated JobProjection jobs = 2;
  repeated JobHandlerProjection handlers = 3;
  // 稳定原 Job ID；空页不返回 cursor，短非空页仍可继续读取。
  optional string next_after_job_id = 4;
  repeated JobNotificationProjection notifications = 5;
}
