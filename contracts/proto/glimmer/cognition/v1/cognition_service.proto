syntax = "proto3";

package glimmer.cognition.v1;

import "glimmer/common/v1/service_contract.proto";
import "glimmer/capabilities/v1/capabilities.proto";
import "glimmer/content/v1/content.proto";
import "glimmer/jobs/v1/jobs.proto";
import "google/protobuf/struct.proto";

option csharp_namespace = "GlimmerCradle.Contracts.Glimmer.Cognition.V1";

enum AddressMode {
  ADDRESS_MODE_UNSPECIFIED = 0;
  ADDRESS_MODE_DIRECT = 1;
  ADDRESS_MODE_AMBIENT = 2;
}

enum ResponsePolicy {
  RESPONSE_POLICY_UNSPECIFIED = 0;
  RESPONSE_POLICY_REPLY_ALLOWED = 1;
  RESPONSE_POLICY_OBSERVE_ONLY = 2;
}

enum RetentionCeiling {
  RETENTION_CEILING_UNSPECIFIED = 0;
  RETENTION_CEILING_TRANSIENT = 1;
  RETENTION_CEILING_EXPERIENCE = 2;
  RETENTION_CEILING_MEMORY_CANDIDATE = 3;
}

message ConversationContext {
  string source_provider_id = 1;
  string scene_id = 2;
  string conversation_id = 3;
  string continuity_id = 4;
  string thread_id = 5;
  string interaction_id = 6;
  string recall_scope = 7;
  string disclosure_scope = 8;
}

message SourceDescriptor {
  string provider_kind = 1;
  string provider_id = 2;
  string provider_version = 3;
  string contribution_id = 4;
  string source_event_id = 5;
  string schema_ref = 6;
  string content_hash = 7;
  string trust_tier = 8;
  string privacy_class = 9;
  string cognitive_effect = 10;
}

message ModalitySemantic {
  string text = 1;
  string source = 2;
  optional bool resolved = 3;
  optional double confidence = 4;
}

message ModalityItem {
  string modality = 1;
  string text = 2;
  string uri = 3;
  string mime_type = 4;
  ModalitySemantic semantic = 5;
  google.protobuf.Struct metadata = 6;
}

message PerceptionPart {
  glimmer.content.v1.ContentPart content = 1;
  ModalitySemantic semantic = 2;
}

message PerceptionContent {
  string text = 1;
  repeated string modality = 2;
  string actor_id = 3;
  string actor_name = 4;
  repeated ModalityItem items = 5;
  repeated PerceptionPart parts = 6;
}

message SubmitPerceptionRequest {
  glimmer.common.v1.CallMetadata call = 1;
  string perception_id = 2;
  string sensory_type = 3;
  string source = 4;
  double timestamp_ms = 5;
  int32 familiarity = 6;
  AddressMode address_mode = 7;
  ResponsePolicy response_policy = 8;
  ConversationContext conversation = 9;
  SourceDescriptor origin = 10;
  RetentionCeiling retention_ceiling = 11;
  PerceptionContent content = 12;
}

message SubmitPerceptionResponse {
  string operation_id = 1;
  PerceptionOperationState state = 2;
  bool duplicate = 3;
}

enum PerceptionOperationState {
  PERCEPTION_OPERATION_STATE_UNSPECIFIED = 0;
  PERCEPTION_OPERATION_STATE_ACCEPTED = 1;
  PERCEPTION_OPERATION_STATE_RUNNING = 2;
  PERCEPTION_OPERATION_STATE_SUCCEEDED = 3;
  PERCEPTION_OPERATION_STATE_CANCELLED = 4;
  PERCEPTION_OPERATION_STATE_FAILED = 5;
}

message CancelPerceptionRequest {
  glimmer.common.v1.CallMetadata call = 1;
  string target_trace_id = 2;
  string scene_id = 3;
  string reason = 4;
}

message CancelPerceptionResponse {
  string operation_id = 1;
  string target_trace_id = 2;
  PerceptionOperationState state = 3;
  bool terminal = 4;
}

message GetPerceptionOperationRequest {
  glimmer.common.v1.CallMetadata call = 1;
  string operation_id = 2;
}

message GetPerceptionOperationResponse {
  string operation_id = 1;
  PerceptionOperationState state = 2;
  bool terminal = 3;
  string safe_message = 4;
}

message KnowledgeRetrievalConfig {
  string mode = 1;
  int32 top_k = 2;
  double min_score = 3;
  double semantic_weight = 4;
}

message KnowledgeEntry {
  string entry_id = 1;
  string scope = 2;
  string content = 3;
  bool enabled = 4;
  int32 priority = 5;
}

message InitializeKnowledgeRequest {
  glimmer.common.v1.CallMetadata call = 1;
  string version = 2;
  KnowledgeRetrievalConfig retrieval = 3;
  repeated KnowledgeEntry entries = 4;
}

message InitializeKnowledgeResponse {
  string operation_id = 1;
  string status = 2;
  bool duplicate = 3;
}

// 可信 App 管理入口；来源声明不是 Resource IO 或保存授权。
message KnowledgeResourceSource {
  string source_id = 1;
  glimmer.capabilities.v1.CapabilityReference reference = 2;
  // 缺省是显式 global；存在时必须是完整 provider/scene/conversation，禁止 user_id。
  glimmer.capabilities.v1.CapabilityScopeContext scope = 3;
  uint64 priority = 4;
  // 必须有 presence，不能把遗漏等同停用或启用。
  optional bool enabled = 5;
}

message KnowledgeResourceSourceState {
  KnowledgeResourceSource source = 1;
  uint64 source_revision = 2;
  // SHA-256 固定顺序 UTF-8 JSON declaration；不包含正文/临时 proof。
  string declaration_digest = 3;
}

message GetKnowledgeResourceSourceRequest {
  glimmer.common.v1.CallMetadata call = 1;
  string source_id = 2;
}
message GetKnowledgeResourceSourceResponse {
  // 不存在时缺省；禁止返回伪造的有效 revision。
  KnowledgeResourceSourceState state = 1;
}
message RegisterKnowledgeResourceSourceRequest {
  glimmer.common.v1.CallMetadata call = 1;
  KnowledgeResourceSource source = 2;
  uint64 expected_source_revision = 3;
}
message RegisterKnowledgeResourceSourceResponse {
  KnowledgeResourceSourceState state = 1;
}
message CollectKnowledgeSourceRequest {
  glimmer.common.v1.CallMetadata call = 1;
  string source_id = 2;
  uint64 expected_source_revision = 3;
}
message CollectKnowledgeSourceResponse {
  string source_id = 1;
  uint64 source_revision = 2;
  string entry_id = 3;
  uint64 entry_revision = 4;
  string content_digest = 5;
}

message SkillToolDescriptor {
  string skill_id = 1;
  string tool_name = 2;
  string description = 3;
  google.protobuf.Struct parameters_schema = 4;
}

message PlanRequest {
  glimmer.common.v1.CallMetadata call = 1;
  string user_goal = 2;
  string scene_id = 3;
  repeated SkillToolDescriptor available_tools = 4;
  repeated glimmer.capabilities.v1.SkillDescriptor available_skills = 5;
  repeated glimmer.capabilities.v1.SkillMaterial skill_materials = 6;
}

message SkillToolSuggestion {
  string skill_id = 1;
  string tool_name = 2;
  string purpose = 3;
  double confidence = 4;
  google.protobuf.Struct arguments_hint = 5;
}

message PlanResponse {
  string summary = 1;
  string reasoning = 2;
  repeated SkillToolSuggestion suggestions = 3;
  string trace_id = 4;
  repeated glimmer.capabilities.v1.SkillReference selected_skills = 5;
}

message ToolResult {
  string tool_name = 1;
  string status = 2;
  string result_json = 3;
  string invocation_id = 4;
  string provider_kind = 5;
  string provider_id = 6;
  string provider_version = 7;
  string source_event_id = 8;
  string schema_ref = 9;
  string skill_id = 10;
  string arguments_json = 11;
}

message SynthesizeRequest {
  glimmer.common.v1.CallMetadata call = 1;
  string original_goal = 2;
  string scene_id = 3;
  ConversationContext conversation = 4;
  repeated ToolResult tool_results = 5;
}

message SynthesizeResponse {
  string reply_content = 1;
  google.protobuf.Struct emotion_state = 2;
  string trace_id = 3;
}

message GetConversationHistoryRequest {
  glimmer.common.v1.CallMetadata call = 1;
  string request_id = 2;
  string conversation_id = 3;
  string scene_id = 4;
  string thread_id = 5;
  string actor_id = 6;
  string actor_name = 7;
  string source_provider_id = 8;
  string cursor = 9;
  int32 limit = 10;
  repeated string allowed_scopes = 11;
}

message ConversationHistoryEntry {
  string entry_id = 1;
  string source_kind = 2;
  string role = 3;
  string status = 4;
  string text = 5;
  string title = 6;
  string occurred_at = 7;
  string trace_id = 8;
  string interaction_id = 9;
  string moment_id = 10;
  int64 position = 11;
  string conversation_id = 12;
  string scene_id = 13;
  string thread_id = 14;
  string actor_id = 15;
  string actor_name = 16;
  string recall_scope = 17;
  string disclosure_scope = 18;
}

message GetConversationHistoryResponse {
  string request_id = 1;
  string status = 2;
  ConversationContext conversation = 3;
  repeated ConversationHistoryEntry items = 4;
  string next_cursor = 5;
  bool has_more = 6;
  string message = 7;
}

message HeartbeatRequest {
  glimmer.common.v1.CallMetadata call = 1;
}

message HeartbeatResponse {
  string status = 1;
  string generation = 2;
}

message GetReadinessRequest {
  glimmer.common.v1.CallMetadata call = 1;
}

message GetReadinessResponse {
  string state = 1;
  string phase = 2;
  string generation = 3;
}

message ShutdownRequest {
  glimmer.common.v1.CallMetadata call = 1;
  string reason = 2;
}

message ShutdownResponse {
  string operation_id = 1;
  string status = 2;
  bool duplicate = 3;
}

message ExecuteMemoryJobRequest {
  glimmer.common.v1.CallMetadata call = 1;
  glimmer.jobs.v1.JobExecutionIdentity identity = 2;
  string episode_id = 3;
  uint64 episode_version = 4;
  string input_digest = 5;
}

message ReconcileMemoryJobRequest {
  glimmer.common.v1.CallMetadata call = 1;
  glimmer.jobs.v1.JobExecutionIdentity identity = 2;
}

enum MemoryJobResolution {
  MEMORY_JOB_RESOLUTION_UNSPECIFIED = 0;
  MEMORY_JOB_RESOLUTION_APPLIED = 1;
  MEMORY_JOB_RESOLUTION_NOT_APPLIED = 2;
}

message MemoryJobResult {
  glimmer.jobs.v1.JobExecutionIdentity identity = 1;
  MemoryJobResolution resolution = 2;
  string receipt_id = 3;
  string operation_id = 4;
  repeated string memory_ids = 5;
  string committed_at = 6;
  string source_id = 7;
  bool receiver_fenced = 8;
  string evidence_id = 9;
  uint64 observed_at_ms = 10;
  bool duplicate = 11;
}

message ExecuteMemoryJobResponse {
  MemoryJobResult result = 1;
}

message ReconcileMemoryJobResponse {
  MemoryJobResult result = 1;
}

// Memory 源投递身份；不包含 Moment 正文，也不表示业务完成。
message MemoryJobSourceRequest {
  string request_id = 1;
  string episode_id = 2;
  uint64 episode_version = 3;
  string scope_id = 4;
  string input_digest = 5;
  string created_at = 6;
}

message ReadMemoryJobRequestsRequest {
  glimmer.common.v1.CallMetadata call = 1;
  uint32 limit = 2;
}

message ReadMemoryJobRequestsResponse {
  repeated MemoryJobSourceRequest requests = 1;
}

message AcknowledgeMemoryJobRequestRequest {
  glimmer.common.v1.CallMetadata call = 1;
  MemoryJobSourceRequest request = 2;
  string job_id = 3;
}

message AcknowledgeMemoryJobRequestResponse {
  string request_id = 1;
  string job_id = 2;
  bool accepted = 3;
}

message PublishMemoryJobStateRequest {
  glimmer.common.v1.CallMetadata call = 1;
  glimmer.jobs.v1.JobStateEvent event = 2;
  // 当前投递主的 epoch，可大于待投递事实的原 epoch；接收端只保留观测 high-water。
  uint64 delivery_authority_epoch = 3;
}

message PublishMemoryJobStateResponse {
  string event_id = 1;
  bool accepted = 2;
  bool duplicate = 3;
}

// 只携带不可变语义版本引用；完成条件与计划正文继续归 Cognition。
message PlanningJobSourceRequest {
  // SHA-256(紧凑 UTF-8 JSON ["planning.evaluate", commitment_id, plan_id, plan_version])。
  string request_id = 1;
  string commitment_id = 2;
  string plan_id = 3;
  uint64 plan_version = 4;
  string goal_id = 5;
  uint64 goal_version = 6;
  string scope_id = 7;
  // 源 owner 的首次 due；重投不可按当前时间或 Memory debounce 重算。
  uint64 due_at_ms = 8;
}

message ReadPlanningJobRequestsRequest {
  glimmer.common.v1.CallMetadata call = 1;
  uint32 limit = 2;
}

message ReadPlanningJobRequestsResponse {
  repeated PlanningJobSourceRequest requests = 1;
}

// 仅在真实 Jobs 提交后确认源投递；不代表承诺或业务已完成。
message AcknowledgePlanningJobRequestRequest {
  glimmer.common.v1.CallMetadata call = 1;
  PlanningJobSourceRequest request = 2;
  string job_id = 3;
  uint64 job_revision = 4;
  bool duplicate = 5;
}

message AcknowledgePlanningJobRequestResponse {
  string request_id = 1;
  string job_id = 2;
  bool accepted = 3;
}

message ReconcilePlanningJobRequest {
  glimmer.common.v1.CallMetadata call = 1;
  glimmer.jobs.v1.JobExecutionIdentity identity = 2;
  string request_id = 3;
}

// 可信 App 显式接纳；普通模型回复/工具调用不自动成为长期承诺。
message AcceptPlanningCommitmentRequest {
  glimmer.common.v1.CallMetadata call = 1;
  string commitment_id = 2;
  string plan_id = 3;
  uint64 plan_version = 4;
  string goal_id = 5;
  uint64 goal_version = 6;
  string text = 7;
  string completion_condition = 8;
  repeated string steps = 9;
  string source_moment_id = 10;
  uint64 due_at_ms = 11;
}

message AcceptPlanningCommitmentResponse {
  string commitment_id = 1;
  string plan_id = 2;
  uint64 plan_version = 3;
  uint64 revision = 4;
  string status = 5;
  string scope_id = 6;
}

message ExecutePlanningJobRequest {
  glimmer.common.v1.CallMetadata call = 1;
  glimmer.jobs.v1.JobExecutionIdentity identity = 2;
  string request_id = 3;
}

message ExecutePlanningJobResponse {
  PlanningJobResult result = 1;
}

// 只读 claim 前筛选；不产生 attempt/封口，不替代 Execute 的 live 复验。
message GetPlanningJobAdmissionRequest {
  glimmer.common.v1.CallMetadata call = 1;
  string request_id = 2;
  string job_id = 3;
  string scope_id = 4;
}

message GetPlanningJobAdmissionResponse {
  string request_id = 1;
  string job_id = 2;
  string scope_id = 3;
  bool eligible = 4;
  // planning_ready 或 planning_ 前缀的 source_unbound/source_unavailable/model_policy/model_unavailable。
  string reason_code = 5;
}

enum PlanningJobResolution {
  PLANNING_JOB_RESOLUTION_UNSPECIFIED = 0;
  PLANNING_JOB_RESOLUTION_APPLIED = 1;
  PLANNING_JOB_RESOLUTION_NOT_APPLIED = 2;
}

// 受控引用，不复制 Conversation/Knowledge/Execution 证据正文。
message PlanningEvidenceReference {
  string evidence_id = 1;
  string source_owner = 2;
  string scope_id = 3;
  uint64 revision = 4;
  string content_digest = 5;
}

message PlanningEvaluationReceipt {
  string receipt_id = 1;
  // 实际提交者；新 attempt 复用 receipt 时不重写原 identity。
  glimmer.jobs.v1.JobExecutionIdentity identity = 2;
  string request_id = 3;
  string commitment_id = 4;
  uint64 commitment_revision = 5;
  // Job applied 仅表示已接纳评估；completed=false 仍是有效业务结果。
  bool completed = 6;
  repeated string evidence_ids = 7;
  string reason = 8;
  repeated PlanningEvidenceReference evidence = 9;
  uint64 committed_at_ms = 10;
}

message PlanningJobResult {
  glimmer.jobs.v1.JobExecutionIdentity identity = 1;
  string request_id = 2;
  PlanningJobResolution resolution = 3;
  // not-applied 禁止携带 receipt；applied 必须引用真实持久 receipt。
  PlanningEvaluationReceipt receipt = 4;
  string source_id = 5;
  bool receiver_fenced = 6;
  // SHA-256(紧凑 UTF-8 JSON ["planning-reconciliation.v1", job_id, scope_id,
  // attempt, authority_epoch, fencing_token, owner_id, lease_until_ms, request_id,
  // "applied"|"not_applied", receipt_id|"sealed", observed_at_ms])。
  string evidence_id = 7;
  uint64 observed_at_ms = 8;
}

message ReconcilePlanningJobResponse {
  PlanningJobResult result = 1;
}

service CognitionService {
  rpc SubmitPerception(SubmitPerceptionRequest) returns (SubmitPerceptionResponse);
  rpc CancelPerception(CancelPerceptionRequest) returns (CancelPerceptionResponse);
  rpc GetPerceptionOperation(GetPerceptionOperationRequest) returns (GetPerceptionOperationResponse);
  rpc InitializeKnowledge(InitializeKnowledgeRequest) returns (InitializeKnowledgeResponse);
  rpc GetKnowledgeResourceSource(GetKnowledgeResourceSourceRequest) returns (GetKnowledgeResourceSourceResponse);
  rpc RegisterKnowledgeResourceSource(RegisterKnowledgeResourceSourceRequest) returns (RegisterKnowledgeResourceSourceResponse);
  // 每次实际采集；丢失 ACK 不能恢复旧 proof 或依靠内存 idempotency cache 宣称成功。
  rpc CollectKnowledgeSource(CollectKnowledgeSourceRequest) returns (CollectKnowledgeSourceResponse);
  rpc Plan(PlanRequest) returns (PlanResponse);
  rpc Synthesize(SynthesizeRequest) returns (SynthesizeResponse);
  rpc GetConversationHistory(GetConversationHistoryRequest) returns (GetConversationHistoryResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc GetReadiness(GetReadinessRequest) returns (GetReadinessResponse);
  rpc Shutdown(ShutdownRequest) returns (ShutdownResponse);
  rpc ExecuteMemoryJob(ExecuteMemoryJobRequest) returns (ExecuteMemoryJobResponse);
  // 此调用会持久封口原 attempt；不是只读查询。空结果不得返回 not-applied。
  rpc ReconcileMemoryJob(ReconcileMemoryJobRequest) returns (ReconcileMemoryJobResponse);
  // 仅在外部 Jobs owner 模式开放；不能与旧巩固队列双消费。
  rpc ReadMemoryJobRequests(ReadMemoryJobRequestsRequest) returns (ReadMemoryJobRequestsResponse);
  rpc AcknowledgeMemoryJobRequest(AcknowledgeMemoryJobRequestRequest) returns (AcknowledgeMemoryJobRequestResponse);
  // inbox 与投影同事务接纳后才 ACK；legacy 模式拒绝调用。
  rpc PublishMemoryJobState(PublishMemoryJobStateRequest) returns (PublishMemoryJobStateResponse);
  // 显式 Planning 持久 owner ready 后开放；与 Memory 旧队列选择独立。
  rpc ReadPlanningJobRequests(ReadPlanningJobRequestsRequest) returns (ReadPlanningJobRequestsResponse);
  rpc AcknowledgePlanningJobRequest(AcknowledgePlanningJobRequestRequest) returns (AcknowledgePlanningJobRequestResponse);
  // 独立封口与提交共享 Planning 事务锁；可在 stopping 时完成，不调用模型或收集证据。
  rpc ReconcilePlanningJob(ReconcilePlanningJobRequest) returns (ReconcilePlanningJobResponse);
  rpc AcceptPlanningCommitment(AcceptPlanningCommitmentRequest) returns (AcceptPlanningCommitmentResponse);
  rpc ExecutePlanningJob(ExecutePlanningJobRequest) returns (ExecutePlanningJobResponse);
  rpc GetPlanningJobAdmission(GetPlanningJobAdmissionRequest) returns (GetPlanningJobAdmissionResponse);
}
